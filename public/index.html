<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AKTU DATA Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-top: 4rem;
      padding-bottom: 4rem;
    }
  </style>
</head>
<body class="px-4">
  <div class="w-full max-w-lg mx-auto space-y-6">
    
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-white">AKTU Data Search</h1>
    </header>

    <div id="error-banner" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-3 rounded-xl text-sm flex gap-3 items-center backdrop-blur-sm">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" class="shrink-0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      <span id="error-text"></span>
    </div>

    <div id="init-loader" class="bg-slate-800/50 border border-slate-700/50 p-12 rounded-2xl flex flex-col items-center justify-center text-slate-400 space-y-4 shadow-xl backdrop-blur-md">
      <div class="w-8 h-8 border-2 border-slate-600 border-t-blue-500 rounded-full animate-spin"></div>
      <p class="text-sm font-medium">Connecting securely...</p>
    </div>

    <form id="search-form" class="hidden bg-slate-800/80 border border-slate-700/50 p-6 md:p-8 rounded-2xl shadow-xl backdrop-blur-md space-y-6">
      
      <div class="space-y-5">
        <div>
           <div class="flex items-center justify-between mb-2">
             <label for="enrollment-input" class="block text-sm font-medium text-slate-300">AKTU Roll Number</label>
             <span class="text-xs text-slate-400">13 digits</span>
           </div>
           <input type="text" id="enrollment-input" maxlength="15" required class="w-full bg-slate-900/80 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl px-4 py-3 text-slate-200 outline-none transition-all placeholder-slate-500 font-mono text-base tracking-wider" placeholder="e.g. 2500541530140" />
           
           <div id="college-badge" class="hidden mt-2 p-3 bg-blue-950/50 border border-blue-800/40 rounded-xl text-xs text-blue-300 flex items-start gap-2.5 transition-all shadow-sm">
             <svg class="w-4 h-4 text-blue-400 shrink-0 mt-0.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
             <div class="flex-1 min-w-0">
               <div class="font-medium text-slate-200" id="detected-college-name"></div>
               <div class="text-[11px] text-blue-400 mt-0.5" id="detected-college-code"></div>
             </div>
           </div>
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" id="submit-btn" disabled class="w-full rounded-xl py-3.5 px-6 flex items-center justify-center font-semibold text-sm transition-all duration-200 bg-slate-700/50 text-slate-500 cursor-not-allowed shadow-md">
          <span id="submit-text">Extract Details</span>
          <span id="submit-loader" class="hidden flex items-center gap-2">
             <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
             <span id="submit-loader-text">Searching...</span>
          </span>
        </button>
      </div>

    </form>

    <!-- CAPTCHA Modal Popup -->
    <div id="captcha-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm hidden transition-opacity duration-200">
      <div class="bg-slate-800 border border-slate-700/80 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-5">
        
        <div class="flex items-center justify-between border-b border-slate-700/50 pb-3">
          <div class="flex items-center gap-2">
            <svg class="w-5 h-5 text-blue-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
            <h3 class="text-base font-semibold text-white">Security Verification</h3>
          </div>
          <button type="button" id="close-modal-btn" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-700/50 transition">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <p class="text-xs text-slate-300">Please enter the security characters shown below to complete verification.</p>

        <div id="modal-error-banner" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 px-3.5 py-2.5 rounded-xl text-xs flex gap-2 items-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" class="shrink-0" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="modal-error-text"></span>
        </div>

        <div class="flex items-center justify-center gap-3">
          <div class="bg-white rounded-xl p-1 border border-slate-600 flex items-center justify-center overflow-hidden shrink-0 shadow-sm" style="width: 210px; height: 56px; aspect-ratio: 15/4;">
            <img id="captcha-img" src="" alt="CAPTCHA" width="210" height="56" style="width: 210px; height: 56px; aspect-ratio: 15/4;" class="w-[210px] h-[56px] object-cover rounded-lg" />
          </div>
          <button type="button" id="refresh-captcha-btn" class="h-14 px-4 rounded-xl bg-slate-700/90 hover:bg-slate-600 active:bg-slate-500 border border-slate-600/70 text-slate-200 hover:text-white font-medium text-xs tracking-wide transition flex items-center justify-center shadow-sm" title="Refresh CAPTCHA">
            Refresh
          </button>
        </div>

        <div>
          <input type="text" id="captcha-input" maxlength="6" class="w-full bg-slate-900/90 border border-slate-700 focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 rounded-xl px-4 py-3 text-slate-100 outline-none transition placeholder-slate-500 tracking-widest text-center uppercase font-mono text-lg font-semibold" placeholder="Enter characters above" autocomplete="off" />
        </div>

        <div class="flex items-center gap-3 pt-1">
          <button type="button" id="cancel-modal-btn" class="w-1/3 rounded-xl py-3 px-4 font-semibold text-xs transition bg-slate-700/60 hover:bg-slate-700 text-slate-300 hover:text-white">
            Cancel
          </button>
          <button type="button" id="verify-modal-btn" class="w-2/3 rounded-xl py-3 px-4 flex items-center justify-center gap-2 font-semibold text-xs transition bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-500/20">
            <span id="verify-text">Verify & Continue</span>
            <span id="verify-loader" class="hidden flex items-center gap-1.5">
              <svg class="animate-spin h-3.5 w-3.5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
              <span>Verifying...</span>
            </span>
          </button>
        </div>

      </div>
    </div>

    <div id="result-card" class="hidden bg-slate-800/80 rounded-2xl shadow-xl border border-slate-700/50 overflow-hidden backdrop-blur-md">
      <div class="px-6 py-4 border-b border-slate-700/50 flex items-center justify-between">
         <h2 class="text-sm font-semibold text-slate-200">Verified Profile</h2>
         <span class="flex h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
      </div>
      
      <div class="p-6">
        <div id="result-grid" class="flex flex-col space-y-3 text-sm">
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
