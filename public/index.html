<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Verify</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-top: 4rem;
      padding-bottom: 4rem;
    }
  </style>
</head>
<body class="px-4">
  <div class="w-full max-w-lg mx-auto space-y-6">
    
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold tracking-tight text-white">Student Verify</h1>
    </header>

    <div id="error-banner" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 px-4 py-3 rounded-xl text-sm flex gap-3 items-center backdrop-blur-sm">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" class="shrink-0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      <span id="error-text"></span>
    </div>

    <div id="init-loader" class="bg-slate-800/50 border border-slate-700/50 p-12 rounded-2xl flex flex-col items-center justify-center text-slate-400 space-y-4 shadow-xl backdrop-blur-md">
      <div class="w-8 h-8 border-2 border-slate-600 border-t-blue-500 rounded-full animate-spin"></div>
      <p class="text-sm font-medium">Connecting securely...</p>
    </div>

    <form id="search-form" class="hidden bg-slate-800/80 border border-slate-700/50 p-6 md:p-8 rounded-2xl shadow-xl backdrop-blur-md space-y-6">
      
      <div class="space-y-5">
        <div>
          <label for="college-select" class="block text-sm font-medium text-slate-300 mb-2">Select College</label>
          <div class="relative">
            <select id="college-select" class="w-full bg-slate-900/80 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl px-4 py-3 text-slate-200 outline-none transition-all appearance-none cursor-pointer">
              <option value="11041">BBDITM</option>
              <option value="11173">BBDNIIT</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
              <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
          </div>
        </div>

        <div>
           <label for="enrollment-input" class="block text-sm font-medium text-slate-300 mb-2">Enrollment Number</label>
           <input type="text" id="enrollment-input" required class="w-full bg-slate-900/80 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl px-4 py-3 text-slate-200 outline-none transition-all placeholder-slate-500" placeholder="Enter student ID..." />
        </div>

        <div id="captcha-section" class="hidden">
           <label class="block text-sm font-medium text-slate-300 mb-2">Security Challenge <span class="text-slate-500 text-xs">(Manual verification required)</span></label>
           
           <div class="flex gap-3 mb-3 h-14">
             <div class="bg-slate-900/50 rounded-xl p-1 border border-slate-700 flex items-center justify-center flex-1 overflow-hidden">
               <img id="captcha-img" src="" alt="CAPTCHA" class="h-full object-contain mix-blend-screen opacity-90" />
             </div>
             <button type="button" id="refresh-captcha-btn" class="bg-slate-700/40 hover:bg-slate-700 border border-slate-600/50 text-slate-300 rounded-xl px-4 transition-colors flex items-center justify-center" title="Refresh code">
               <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
             </button>
           </div>
           
           <input type="text" id="captcha-input" class="w-full bg-slate-900/80 border border-slate-700 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 rounded-xl px-4 py-3 text-slate-200 outline-none transition-all placeholder-slate-500 tracking-widest text-center uppercase" placeholder="Enter characters above" />
        </div>
      </div>

      <button type="submit" id="submit-btn" disabled class="w-full rounded-xl py-3.5 flex items-center justify-center font-semibold text-sm transition-all duration-200 bg-slate-700/50 text-slate-500 cursor-not-allowed">
        <span id="submit-text">Extract Details</span>
        <span id="submit-loader" class="hidden flex items-center">
           <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
           <span id="submit-loader-text">Processing...</span>
        </span>
      </button>

    </form>

    <div id="result-card" class="hidden bg-slate-800/80 rounded-2xl shadow-xl border border-slate-700/50 overflow-hidden backdrop-blur-md">
      <div class="px-6 py-4 border-b border-slate-700/50 flex items-center justify-between">
         <h2 class="text-sm font-semibold text-slate-200">Verified Profile</h2>
         <span class="flex h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
      </div>
      
      <div class="p-6">
        <div id="result-grid" class="flex flex-col space-y-3 text-sm">
        </div>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
